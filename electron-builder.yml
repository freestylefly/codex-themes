appId: com.codexthemes.app
productName: Codex Themes
directories:
  output: release
  buildResources: assets/build
files:
  - dist/**
  - package.json
  - "!**/.env*"
  - "!**/*.enc"
extraResources:
  - from: assets/inject
    to: assets/inject
  - from: assets/presets
    to: assets/presets
  - from: assets/skills
    to: assets/skills
  - from: assets/tray
    to: assets/tray
  - from: assets/build
    to: assets/build
asarUnpack: []
fileAssociations:
  - ext: codextheme
    name: Codex Theme Package
    description: Codex Themes package
    role: Editor
    isPackage: true
protocols:
  - name: Codex Themes
    schemes:
      - codexthemes
mac:
  category: public.app-category.utilities
  icon: assets/presets/blue-window-messenger/mascot.png
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: assets/build/entitlements.mac.plist
  entitlementsInherit: assets/build/entitlements.mac.plist
  notarize: true
dmg:
  artifactName: Codex-Themes-${version}-mac-${arch}.${ext}
  title: Codex Themes
  background: assets/dmg/background.png
  iconSize: 128
  iconTextSize: 15
  window:
    width: 960
    height: 600
  contents:
    - x: 240
      y: 350
      type: file
    - x: 720
      y: 350
      type: link
      path: /Applications
win:
  icon: assets/build/icon.png
  target:
    - nsis
nsis:
  artifactName: Codex-Themes-${version}-win-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
artifactName: Codex-Themes-${version}-${os}-${arch}.${ext}
npmRebuild: false
# Auto-update feed. Packaged builds announce GitHub releases in the app.
publish:
  provider: github
  owner: freestylefly
  repo: codex-themes
