name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed ARM64 release
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate architecture and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          app_version="$(node -p "require('./package.json').version")"
          echo "APP_VERSION=${app_version}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            expected_tag="v${app_version}"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}."
              exit 1
            fi
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run type checks
        run: npm run typecheck

      - name: Build website
        run: npm run build:web

      - name: Import macOS signing certificate
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE:?MACOS_CERTIFICATE is required}"
          : "${MACOS_CERTIFICATE_PWD:?MACOS_CERTIFICATE_PWD is required}"
          : "${MACOS_SIGNING_IDENTITY:?MACOS_SIGNING_IDENTITY is required}"

          certificate_path="$RUNNER_TEMP/build-certificate.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"

          if ! printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path" 2>/dev/null; then
            printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$certificate_path"
          fi

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" |
            grep -F "$MACOS_SIGNING_IDENTITY"

          echo "CSC_KEYCHAIN=${keychain_path}" >> "$GITHUB_ENV"

      - name: Build Apple Silicon package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PWD: ${{ secrets.APPLE_APP_PWD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: npm run dist:mac:arm64

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Themes-${{ env.APP_VERSION }}-mac-arm64
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            release/Codex-Themes-${{ env.APP_VERSION }}-mac-arm64.dmg
            release/Codex-Themes-${{ env.APP_VERSION }}-mac-arm64.dmg.blockmap
            release/Codex-Themes-${{ env.APP_VERSION }}-mac-arm64.zip
            release/Codex-Themes-${{ env.APP_VERSION }}-mac-arm64.zip.blockmap
            release/latest-mac.yml

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          notes_path="$RUNNER_TEMP/release-notes.md"
          awk -v version="$APP_VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$notes_path"
          test -s "$notes_path"
          echo "RELEASE_NOTES_PATH=${notes_path}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Codex Themes ${RELEASE_TAG}"
          assets=(
            "release/Codex-Themes-${APP_VERSION}-mac-arm64.dmg"
            "release/Codex-Themes-${APP_VERSION}-mac-arm64.dmg.blockmap"
            "release/Codex-Themes-${APP_VERSION}-mac-arm64.zip"
            "release/Codex-Themes-${APP_VERSION}-mac-arm64.zip.blockmap"
            "release/latest-mac.yml"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release ${RELEASE_TAG} is already public; refusing to replace its assets."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --title "$title" \
              --notes-file "$RELEASE_NOTES_PATH"
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "$title" \
              --notes-file "$RELEASE_NOTES_PATH"
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

          expected_assets="$(
            printf '%s\n' \
              "Codex-Themes-${APP_VERSION}-mac-arm64.dmg" \
              "Codex-Themes-${APP_VERSION}-mac-arm64.dmg.blockmap" \
              "Codex-Themes-${APP_VERSION}-mac-arm64.zip" \
              "Codex-Themes-${APP_VERSION}-mac-arm64.zip.blockmap" \
              "latest-mac.yml" |
              LC_ALL=C sort
          )"
          actual_assets="$(
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
              LC_ALL=C sort
          )"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Release assets do not match the expected set."
            diff <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          fi

          gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Clean temporary keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${CSC_KEYCHAIN:-}" && -f "$CSC_KEYCHAIN" ]]; then
            security delete-keychain "$CSC_KEYCHAIN" || true
          fi
